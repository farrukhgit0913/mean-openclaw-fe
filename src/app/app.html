<main class="dashboard">

  <section class="card">

    <header class="header">
      <div>
        <p class="eyebrow">
          MEAN + OpenClaw
        </p>

        <h1>
          WhatsApp Messenger
        </h1>

        <p class="subtitle">
          Send WhatsApp messages through your
          OpenClaw Gateway.
        </p>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        OpenClaw Connected
      </div>
    </header>

    <form
      class="form"
      (ngSubmit)="sendWhatsAppMessage()"
    >

      <div class="field">

        <label for="phone">
          WhatsApp Number
        </label>

        <input
          id="phone"
          name="phone"
          type="tel"
          placeholder="+923062762437"
          [ngModel]="phoneNumber()"
          (ngModelChange)="phoneNumber.set($event)"
          autocomplete="tel"
        />

        <small>
          Use international E.164 format.
        </small>

      </div>

      <div class="field">

        <label for="message">
          Message
        </label>

        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="Type your WhatsApp message..."
          [ngModel]="message()"
          (ngModelChange)="message.set($event)"
        ></textarea>

      </div>

      @if (successMessage()) {
        <div class="alert success">
          ✓ {{ successMessage() }}
        </div>
      }

      @if (errorMessage()) {
        <div class="alert error">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          Sending...
        } @else {
          Send WhatsApp Message
        }
      </button>

    </form>

    <footer>
      Angular → Express → OpenClaw → WhatsApp
    </footer>

  </section>

</main>

<router-outlet />
